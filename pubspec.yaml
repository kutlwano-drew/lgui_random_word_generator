name: lgui_random_word_generator
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  aura_icon: ^0.0.4
  word_generator: ^0.6.0
  english_words: ^4.0.0
  heroicons: ^0.11.0
  font_awesome_flutter: ^11.0.0
  flutter_glow: ^0.3.2
  audioplayers: ^6.7.1
  easy_localization: ^3.0.8
  drews_desktop_menu: ^0.1.0
  flutter_markdown: ^0.7.7+1
  country_flags: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/images/logo.png"

  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48

  macos:
    generate: true
    image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/docs/
    - assets/translations/

flutter_to_debian:
  arch: x64
